<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360"><rect width="960" height="360" rx="20" fill="#f6f8fb"/><g font-family="sans-serif" text-anchor="middle" fill="#16324f"><text x="130" y="100" font-size="34">元CSV</text><text x="130" y="180" font-size="60">12行</text><text x="295" y="180" font-size="48">→</text><text x="460" y="100" font-size="34">必要な2列あり</text><text x="460" y="180" font-size="60">10行</text><text x="625" y="180" font-size="48">→</text><text x="795" y="100" font-size="34">時間の条件</text><text x="795" y="175" font-size="36">30分以上：8行</text><text x="795" y="235" font-size="36">60分以上：5行</text><text x="460" y="320" font-size="30">欠損の処理と、時間の条件を分けて確認する</text></g></svg>
