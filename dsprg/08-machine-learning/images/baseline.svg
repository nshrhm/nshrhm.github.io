<path d="M110 200h690" stroke="#246bce" stroke-width="4"/><text x="620" y="187" font-size="22">予測値12</text>
<circle cx="300" cy="260" r="10" fill="#b64040"/><circle cx="520" cy="120" r="10" fill="#b64040"/>
