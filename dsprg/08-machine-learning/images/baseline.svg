<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360"><rect width="920" height="360" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><text x="35" y="42" font-size="25">小例：訓練値10・14 kWh → 平均12 kWhで予測</text>
<path d="M110 75v215h690" stroke="#16324f" stroke-width="3" fill="none"/>
