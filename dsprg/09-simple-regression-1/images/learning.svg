<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#f4f7fb"/><g font-family="sans-serif" font-size="26" fill="#173451"><text x="30" y="45">学習で決め、予測で使う</text><rect x="25" y="85" width="280" height="200" rx="20" fill="#d9eaff"/><text x="45" y="130">訓練60行</text><text x="45" y="180">稼働時間 → 電力量</text><text x="45" y="230">fit / lm</text><text x="330" y="190" font-size="50">→</text><rect x="400" y="85" width="220" height="200" rx="20" fill="#d9f1e2"/><text x="425" y="145">切片 a・傾き b</text><text x="425" y="210">ŷ = a + bx</text><text x="650" y="190" font-size="50">→</text><rect x="720" y="85" width="250" height="200" rx="20" fill="#ffecd0"/><text x="745" y="135">新しい入力 x</text><text x="745" y="185">predict</text><text x="745" y="235">予測値 ŷ</text><text x="35" y="355">検証20行・最終確認20行は、学習へ混ぜない。</text></g></svg>