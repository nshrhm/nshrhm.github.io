<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><style>text{font-family:Arial,"Noto Sans CJK JP",sans-serif;fill:#17324d;font-size:23px}.small{font-size:19px}</style><rect width="900" height="360" fill="white"/><text x="30" y="48">残差 +3, −4 kWh から計算する小例</text><rect x="25" y="80" width="850" height="95" rx="10" fill="#e8f1f9"/><text x="45" y="118">MAE：絶対値 3, 4 → 平均 (3+4)/2</text><text x="600" y="155">= 3.5 kWh</text><rect x="25" y="195" width="850" height="130" rx="10" fill="#f4efe4"/><text x="45" y="230">RMSE：二乗 9, 16 kWh² → 平均 12.5 kWh²</text><text x="45" y="280">→ 平方根 √12.5</text><text x="600" y="280">≒ 3.536 kWh</text></svg>