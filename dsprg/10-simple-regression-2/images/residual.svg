<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><style>text{font-family:Arial,"Noto Sans CJK JP",sans-serif;fill:#17324d;font-size:23px}.small{font-size:19px}</style><rect width="900" height="420" fill="white"/><path d="M90 55V340H590" fill="none" stroke="#17324d" stroke-width="3"/><text x="95" y="35">消費電力量（kWh）</text><text x="280" y="390">稼働時間（時間）</text><path d="M100 300L540 100" stroke="#1680ac" stroke-width="4"/><circle cx="320" cy="200" r="8" fill="#1680ac"/><circle cx="320" cy="110" r="8" fill="#d05a34"/><path d="M320 119V191M313 126L320 119L327 126M313 184L320 191L327 184" stroke="#d05a34" fill="none" stroke-width="3"/><text x="348" y="115">実測 30 kWh</text><text x="348" y="215">予測 26 kWh</text><text x="600" y="145">残差 = 30 − 26</text><text x="600" y="185">= +4 kWh</text><text x="600" y="240">予測が小さい</text><text class="small" x="105" y="370">概念図：数値・直線は説明用</text></svg>