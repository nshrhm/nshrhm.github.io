<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><rect width="1000" height="420" fill="white"/><g font-family="sans-serif" font-size="24" fill="#193653"><rect x="35" y="75" width="250" height="100" rx="15" fill="#e8f2ff"/><text x="60" y="115">稼働時間（時間）</text><text x="60" y="150">処理量（個）</text><path d="M290 125 H395" stroke="#3179bd" stroke-width="5"/><path d="M380 115 L395 125 L380 135" fill="none" stroke="#3179bd" stroke-width="5"/><rect x="400" y="70" width="280" height="110" rx="15" fill="#e2f3e9"/><text x="420" y="115">訓練60行で学習</text><text x="420" y="150">切片＋二つの係数</text><path d="M685 125 H780" stroke="#3179bd" stroke-width="5"/><rect x="785" y="75" width="190" height="100" rx="15" fill="#fff0d5"/><text x="800" y="115">予測電力量</text><text x="820" y="150">（kWh）</text><text x="50" y="265">比較用単回帰：稼働時間の一列を保つ</text><text x="50" y="315">変更対象：処理量を追加し、係数を同時に学習</text><text x="50" y="365">検証20行は両モデルで共通</text></g></svg>