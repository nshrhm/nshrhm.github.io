<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390"><rect width="900" height="390" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><rect x="30" y="40" width="240" height="80" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="150.0" y="89.0" text-anchor="middle" font-size="27">80行だけで選択</text><text x="281" y="91" font-size="35">→</text><rect x="325" y="40" width="240" height="80" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="445.0" y="89.0" text-anchor="middle" font-size="27">選択記録を保存</text><text x="577" y="91" font-size="35">→</text><rect x="620" y="40" width="250" height="80" rx="12" fill="#fff4da" stroke="#246bce"/><text x="745.0" y="89.0" text-anchor="middle" font-size="27">最終20行を読む</text><text x="55" y="180" font-size="24">候補・ID・入力ハッシュ</text><text x="55" y="230" font-size="24">係数・比較指標を記録</text><text x="470" y="180" font-size="24">固定係数で予測・MAE・RMSE</text><text x="470" y="230" font-size="24">入力と選択記録のハッシュを保存</text><rect x="130" y="285" width="640" height="65" rx="12" fill="#fff4da" stroke="#246bce"/><text x="450.0" y="326.5" text-anchor="middle" font-size="27">最終結果から候補や条件を変更しない</text></g></svg>
