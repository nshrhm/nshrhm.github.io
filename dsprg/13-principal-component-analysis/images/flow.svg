<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img"><title>4測定値から標準化とPCAを通して2軸へ要約する</title><rect width="960" height="390" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><rect x="20" y="100" width="270" height="135" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="35" y="145" font-size="24">4測定値 (cm)</text><text x="35" y="190" font-size="19">150行 × 4列</text><rect x="345" y="100" width="270" height="135" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="360" y="145" font-size="24">中心化・標準化</text><text x="360" y="190" font-size="19">(値 − 列平均) / 標本SD</text><rect x="670" y="100" width="270" height="135" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="685" y="145" font-size="24">PCA → 2軸</text><text x="685" y="190" font-size="19">150行 × PC1・PC2</text><text x="295" y="170" font-size="38">→</text><text x="620" y="170" font-size="38">→</text><text x="40" y="300" font-size="25">IDは対応付けに使う。speciesは入力へ入れない。</text></g></svg>