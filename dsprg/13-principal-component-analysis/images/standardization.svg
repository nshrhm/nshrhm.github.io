<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img"><title>I001のがく片長の標準化。cmから無次元へ</title><rect width="960" height="390" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><text x="40" y="48" font-size="29">列ごとに平均を引き、標本標準偏差で割る</text><text x="50" y="115" font-size="28">I001のがく片長：5.1 cm</text><text x="50" y="175" font-size="28">(5.1 − 5.843333…) / 0.828066…</text><text x="50" y="235" font-size="30">≈ −0.897674（無次元）</text><text x="50" y="310" font-size="24">標準偏差の分母は n − 1。途中で丸めない。</text></g></svg>