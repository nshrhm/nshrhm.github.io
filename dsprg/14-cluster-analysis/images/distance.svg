<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img"><title>I001と各中心の4次元二乗距離</title><rect width="960" height="390" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><text x="35" y="50" font-size="28">I001から3つの中心への二乗距離（無次元）</text><text x="40" y="110" font-size="24">中心1</text><rect x="180" y="84" width="1.081172886554127" height="35" fill="#2563eb"/><text x="191.08117288655413" y="110" font-size="22">0.045049</text><text x="40" y="195" font-size="24">中心2</text><rect x="180" y="169" width="237.84808137956185" height="35" fill="#ea580c"/><text x="427.84808137956185" y="195" font-size="22">9.910337</text><text x="40" y="280" font-size="24">中心3</text><rect x="180" y="254" width="382.21248705752" height="35" fill="#15803d"/><text x="572.21248705752" y="280" font-size="22">15.925520</text><text x="40" y="365" font-size="23">4つの差を二乗して足す。最も近い中心へ所属。</text></g></svg>