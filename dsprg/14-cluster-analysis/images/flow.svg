<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img"><title>4列で群分けしPCAの2軸で表示する流れ</title><rect width="960" height="390" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><rect x="20" y="100" width="270" height="135" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="32" y="142" font-size="23">4測定値 (cm)</text><text x="32" y="190" font-size="18">150行・IDと種類を除外</text><rect x="345" y="100" width="270" height="135" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="357" y="142" font-size="23">標準化 → k-means</text><text x="357" y="190" font-size="18">4次元で距離と所属を計算</text><rect x="670" y="100" width="270" height="135" rx="12" fill="#e9f4ff" stroke="#246bce"/><text x="682" y="142" font-size="23">PCAで表示</text><text x="682" y="190" font-size="18">同じ2軸に群別の色を付ける</text><text x="295" y="175" font-size="38">→</text><text x="620" y="175" font-size="38">→</text><text x="65" y="310" font-size="23">クラスタ番号に順位はない。図の2列で群分けし直さない。</text></g></svg>