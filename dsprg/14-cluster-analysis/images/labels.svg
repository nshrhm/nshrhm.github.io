<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img"><title>クラスタ番号の一対一対応の例。数値の大小では照合しない</title><rect width="960" height="390" fill="#f6f8fb"/><g font-family="sans-serif" fill="#16324f"><text x="40" y="50" font-size="30">群番号を一つの対応で置き換える</text><text x="70" y="125" font-size="29">Python: 0</text><text x="350" y="125" font-size="36">↔</text><text x="550" y="125" font-size="29">R: 2</text><text x="70" y="205" font-size="29">Python: 1</text><text x="350" y="205" font-size="36">↔</text><text x="550" y="205" font-size="29">R: 3</text><text x="70" y="285" font-size="29">Python: 2</text><text x="350" y="285" font-size="36">↔</text><text x="550" y="285" font-size="29">R: 1</text><text x="35" y="365" font-size="23">この例は番号の置換。全ID・中心・集計に同じ対応を適用。</text></g></svg>