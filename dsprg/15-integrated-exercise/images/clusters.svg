<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330"><rect width="960" height="330" rx="20" fill="#f7f9fc"/><g font-family="sans-serif" fill="#18314e"><text x="40" y="48" font-size="27" font-weight="bold">群分けの空間と表示の空間</text><rect x="40.0" y="85" width="266.6666666666667" height="145" rx="15" fill="#e3effc" stroke="#567086"/><text x="55.0" y="120" font-size="23" font-weight="bold">4測定値（cm）</text><text x="55.0" y="157" font-size="20">全150行で標準化</text><text x="55.0" y="187" font-size="20">標本標準偏差 n−1</text><text x="307.6666666666667" y="170" font-size="23">→</text><rect x="326.6666666666667" y="85" width="266.6666666666667" height="145" rx="15" fill="#e5f3e9" stroke="#567086"/><text x="341.6666666666667" y="120" font-size="23" font-weight="bold">4次元で群分け</text><text x="341.6666666666667" y="157" font-size="20">共通初期中心</text><text x="341.6666666666667" y="187" font-size="20">k=2 → k=3</text><text x="594.3333333333334" y="170" font-size="23">→</text><rect x="613.3333333333334" y="85" width="266.6666666666667" height="145" rx="15" fill="#fff1d6" stroke="#567086"/><text x="628.3333333333334" y="120" font-size="23" font-weight="bold">2次元へ投影</text><text x="628.3333333333334" y="157" font-size="20">同じPCA座標</text><text x="628.3333333333334" y="187" font-size="20">色は所属、軸は無次元</text><text x="40" y="285" font-size="22">二次元で近く見えることだけでは所属を判断できません。</text></g></svg>