<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330"><rect width="960" height="330" rx="20" fill="#f7f9fc"/><g font-family="sans-serif" fill="#18314e"><text x="40" y="48" font-size="27" font-weight="bold">「一致した」を具体的な証拠にする</text><rect x="40.0" y="85" width="266.6666666666667" height="145" rx="15" fill="#e3effc" stroke="#567086"/><text x="55.0" y="120" font-size="23" font-weight="bold">独立計算</text><text x="55.0" y="157" font-size="20">元CSVから他方の言語</text><text x="55.0" y="187" font-size="20">変更対象だけを確認</text><text x="307.6666666666667" y="170" font-size="23">→</text><rect x="326.6666666666667" y="85" width="266.6666666666667" height="145" rx="15" fill="#e5f3e9" stroke="#567086"/><text x="341.6666666666667" y="120" font-size="23" font-weight="bold">指定行の確認</text><text x="341.6666666666667" y="157" font-size="20">A：E005の予測</text><text x="341.6666666666667" y="187" font-size="20">B：I001の二乗距離</text><text x="594.3333333333334" y="170" font-size="23">→</text><rect x="613.3333333333334" y="85" width="266.6666666666667" height="145" rx="15" fill="#fff1d6" stroke="#567086"/><text x="628.3333333333334" y="120" font-size="23" font-weight="bold">保存と再実行</text><text x="628.3333333333334" y="157" font-size="20">CSVを読み直して照合</text><text x="628.3333333333334" y="187" font-size="20">先頭から再実行</text><text x="40" y="285" font-size="22">係数・群番号・IDの対応を明記します。</text></g></svg>