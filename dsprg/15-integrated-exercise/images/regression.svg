<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330"><rect width="960" height="330" rx="20" fill="#f7f9fc"/><g font-family="sans-serif" fill="#18314e"><text x="40" y="48" font-size="27" font-weight="bold">比較の条件を揃える</text><rect x="40.0" y="85" width="266.6666666666667" height="145" rx="15" fill="#e3effc" stroke="#567086"/><text x="55.0" y="120" font-size="23" font-weight="bold">固定する条件</text><text x="55.0" y="157" font-size="20">訓練60行・検証20行</text><text x="55.0" y="187" font-size="20">目的変数：kWh</text><text x="307.6666666666667" y="170" font-size="23">→</text><rect x="326.6666666666667" y="85" width="266.6666666666667" height="145" rx="15" fill="#e5f3e9" stroke="#567086"/><text x="341.6666666666667" y="120" font-size="23" font-weight="bold">変える条件</text><text x="341.6666666666667" y="157" font-size="20">時間だけ</text><text x="341.6666666666667" y="187" font-size="20">→ 時間＋処理量</text><text x="594.3333333333334" y="170" font-size="23">→</text><rect x="613.3333333333334" y="85" width="266.6666666666667" height="145" rx="15" fill="#fff1d6" stroke="#567086"/><text x="628.3333333333334" y="120" font-size="23" font-weight="bold">読む結果</text><text x="628.3333333333334" y="157" font-size="20">予測・残差・係数</text><text x="628.3333333333334" y="187" font-size="20">MAE・RMSE（kWh）</text><text x="40" y="285" font-size="22">検証データを学習へ混ぜない。最終確認20行は使わない。</text></g></svg>